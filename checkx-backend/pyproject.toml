[project]
name = "checkx-backend"
version = "0.1.0"
description = "CheckX design review API and MCP server"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "tortoise-orm[asyncpg]>=1.1,<2",
  "pydantic-settings>=2.8,<3",
  "email-validator>=2.2,<3",
  "python-multipart>=0.0.22,<1",
  "pwdlib[argon2]>=0.3,<1",
  "pillow>=12,<13",
  "httpx>=0.28,<1",
  "mcp>=1.26,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.tortoise]
tortoise_orm = "app.config.TORTOISE_ORM"
